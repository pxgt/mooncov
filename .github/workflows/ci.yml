name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Set up JavaScript test runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update package registry
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Generate and verify interfaces
        run: |
          moon info --target all
          git diff --exit-code

      - name: Check every stable backend
        run: moon check --target all --deny-warn --warn-list +73

      - name: Build every stable backend
        run: moon build --target all

      - name: Test every stable backend
        run: moon test --target all --deny-warn --warn-list +73

      - name: Run the native example
        run: |
          moon run cmd/main
          moon run cmd/main -- summary lcov examples/sample.info
          moon run cmd/main -- validate lcov examples/sample.info
          moon run cmd/main -- summary cobertura examples/sample.xml
          moon run cmd/main -- compare lcov examples/sample.info examples/sample.info
          moon run cmd/main -- regress lcov examples/sample.info examples/sample.info 0

      - name: Verify package artifact
        run: moon package --frozen

      - name: Ensure generated files are committed
        run: git diff --exit-code
